# Сборка из папки решения: docker compose -f deploy/compose.yml up --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env            # BOT_TOKEN=...
    restart: unless-stopped
    # портов наружу нет: доступ только через nginx

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
